[workspace]
members = [
    "programs/replicata",
    "crates/core",
    "crates/client",
    "tests",

]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/aralroca/Replicata"

[workspace.dependencies]
replicata-core = { path = "crates/core" }
anyhow = "1"
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
thiserror = "2.0.21"
tar = "0.4.46"
flate2 = "1.1.10"
proptest = "1.12.0"
tempfile = "3.27.0"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
