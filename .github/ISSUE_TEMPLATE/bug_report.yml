name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [Program, Coordinator, Worker CLI, Web, x402 payments, Docs]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the experiment id / transaction signature if relevant.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: "1. scripts/localnet.sh start\n2. ..."
    validations:
      required: true
  - type: input
    id: cluster
    attributes:
      label: Cluster
      placeholder: localnet / devnet
