name: Keep coordinator awake

# The free hosting tier sleeps after ~15 min without traffic; the coordinator also runs the
# settlement crank, so ping it regularly. Set the repo variable COORDINATOR_URL.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    if: vars.COORDINATOR_URL != ''
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 "${{ vars.COORDINATOR_URL }}/health"
