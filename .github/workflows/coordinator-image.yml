name: Coordinator image

# Builds the coordinator Docker image on GitHub's runners and publishes it to GHCR, so the
# (free) host only has to pull and run it.
on:
  push:
    branches: [main]
    paths: ["crates/**", "programs/**", "Cargo.*", "Dockerfile", ".github/workflows/coordinator-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/aralroca/replicata-coordinator:latest
            ghcr.io/aralroca/replicata-coordinator:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
