[package]
name = "replicata-coordinator"
version = "0.1.0"
description = "Replicata coordinator: indexer, spec/bundle store, finalize crank and x402 paywall"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
axum = "0.8.9"
base64 = "0.22.1"
bincode = "1.3.3"
bs58 = "0.5.1"
hex.workspace = true
http = "1.5.0"
replicata-client = { path = "../client" }
replicata-core.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
solana-client = "3.1.14"
solana-commitment-config = "3.1.1"
solana-keypair = "3.1.2"
solana-signature = { version = "3.5.2", features = ["verify"] }
solana-signer = "3.0.1"
solana-transaction = "3.1.0"
solana-rpc-client-api = "3.1.14"
solana-account-decoder-client-types = "3.1.14"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-webpki", "migrate", "macros"] }
thiserror.workspace = true
tokio = { version = "1.53.2", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["cors", "trace", "limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2"
utoipa = { version = "6.0.0", features = ["axum_extras"] }
x402-axum = "2.0.2"
x402-chain-solana = { version = "2.0.2", features = ["server"] }
x402-types = "2.0.2"

[dev-dependencies]
tempfile.workspace = true
wiremock = "0.6.5"
