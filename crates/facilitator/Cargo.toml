[package]
name = "replicata-facilitator"
version = "0.1.0"
description = "Self-hosted x402 facilitator (v2 exact, Solana) for localnet end-to-end tests"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
axum = "0.8.9"
bs58 = "0.5.1"
serde_json.workspace = true
replicata-client = { path = "../client" }
replicata-core.workspace = true
solana-account = "3.4.0"
solana-client = "3.1.14"
solana-commitment-config = "3.1.1"
solana-signature = "3.5.2"
solana-transaction = "3.1.0"
tokio = { version = "1.53.2", features = ["full"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
x402-chain-solana = { version = "2.0.2", features = ["facilitator"] }
x402-facilitator-local = "2.0.2"
x402-types = "2.0.2"
